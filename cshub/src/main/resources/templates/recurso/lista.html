<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos — CS Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .badge-gratuito { background-color: #198754; color: white; }
        .badge-pago { background-color: #dc3545; color: white; }
        footer { background-color: #212529; color: #adb5bd; padding: 20px 0; margin-top: 60px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-code-square"></i> CS Hub
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/recursos}">
                        <i class="bi bi-collection"></i> Recursos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/recursos/udea}">
                        <i class="bi bi-mortarboard"></i> UdeA
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/seguimientos}">
                        <i class="bi bi-bookmark-check"></i> Mi Lista
                    </a>
                </li>
            </ul>
            <form class="d-flex" th:action="@{/recursos/buscar}" method="get">
                <input class="form-control me-2" type="search" name="q" placeholder="Buscar recursos...">
                <button class="btn btn-outline-light" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container mt-4">

    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ENCABEZADO -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-collection"></i>
            <span th:text="${titulo}">Recursos</span>
        </h2>
        <a th:href="@{/recursos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Agregar Recurso
        </a>
    </div>

    <!-- FILTROS -->
    <div class="card p-3 mb-4">
        <form th:action="@{/recursos/filtrar}" method="get" class="row g-2">
            <div class="col-md-4">
                <select name="tipo" class="form-select">
                    <option value="">Todos los tipos</option>
                    <option th:each="t : ${tipos}"
                            th:value="${t}"
                            th:text="${t.nombre}">Tipo</option>
                </select>
            </div>
            <div class="col-md-4">
                <select name="tema" class="form-select">
                    <option value="">Todos los temas</option>
                    <option th:each="t : ${temas}"
                            th:value="${t}"
                            th:text="${t.nombre}">Tema</option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="nivel" class="form-select">
                    <option value="">Todos los niveles</option>
                    <option th:each="n : ${niveles}"
                            th:value="${n}"
                            th:text="${n.nombre}">Nivel</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-funnel"></i> Filtrar
                </button>
            </div>
        </form>
    </div>

    <!-- LISTA DE RECURSOS -->
    <div th:if="${#lists.isEmpty(recursos)}" class="alert alert-info text-center">
        <i class="bi bi-info-circle"></i> No se encontraron recursos con esos filtros.
        <a th:href="@{/recursos}" class="btn btn-outline-primary btn-sm ms-2">Ver todos</a>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4"
         th:unless="${#lists.isEmpty(recursos)}">
        <div class="col" th:each="recurso : ${recursos}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="mb-2">
                        <span class="badge bg-primary" th:text="${recurso.tipoNombre}">Tipo</span>
                        <span class="badge bg-secondary ms-1" th:text="${recurso.nivelNombre}">Nivel</span>
                        <span th:if="${recurso.gratuito}" class="badge badge-gratuito ms-1">Gratis</span>
                        <span th:unless="${recurso.gratuito}" class="badge badge-pago ms-1">De pago</span>
                    </div>
                    <h5 class="card-title" th:text="${recurso.titulo}">Título</h5>
                    <p class="card-text text-muted small"
                       th:text="${#strings.abbreviate(recurso.descripcion, 120)}">Descripción</p>
                    <p class="card-text">
                        <small class="text-muted">
                            <i class="bi bi-person"></i>
                            <span th:text="${recurso.fuente}">Fuente</span>
                        </small>
                    </p>
                </div>
                <div class="card-footer bg-transparent">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge bg-light text-dark"
                              th:text="${recurso.temaNombre}">Tema</span>
                        <div>
                            <a th:href="@{/recursos/{id}(id=${recurso.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/recursos/editar/{id}(id=${recurso.id})}"
                               class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/recursos/eliminar/{id}(id=${recurso.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Eliminar este recurso?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

<footer class="text-center">
    <div class="container">
        <p class="mb-0">
            <i class="bi bi-code-square"></i> CS Hub — Repositorio de Recursos para Computer Science
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
