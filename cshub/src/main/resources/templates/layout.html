<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido)">
<!--
  th:fragment="layout(titulo, contenido)"
  → Define este archivo como un fragmento reutilizable
  → Recibe dos parámetros:
     - titulo: el título de la pestaña del navegador
     - contenido: el HTML específico de cada página
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- th:text → inserta el valor de la variable "titulo" aquí -->
    <title th:replace="${titulo}">CS Hub</title>

    <!-- Bootstrap 5 desde CDN — no necesitas descargar nada -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-3px); }

        .badge-tipo {
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 20px;
        }
        .badge-gratuito { background-color: #198754; color: white; }
        .badge-pago     { background-color: #dc3545; color: white; }

        .alert { border-radius: 10px; }

        footer {
            background-color: #212529;
            color: #adb5bd;
            padding: 20px 0;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <!-- ── NAVBAR ─────────────────────────────────────── -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-code-square"></i> CS Hub
            </a>

            <!-- Botón hamburguesa para móviles -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Links del navbar -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/recursos}">
                            <i class="bi bi-collection"></i> Recursos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/recursos/gratuitos}">
                            <i class="bi bi-gift"></i> Gratuitos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/seguimientos}">
                            <i class="bi bi-bookmark-check"></i> Mi Lista
                        </a>
                    </li>
                </ul>

                <!-- Barra de búsqueda -->
                <form class="d-flex" th:action="@{/recursos/buscar}" method="get">
                    <input class="form-control me-2" type="search"
                           name="q" placeholder="Buscar recursos...">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- ── CONTENIDO PRINCIPAL ────────────────────────── -->
    <main class="container mt-4">

        <!-- Mensajes de éxito -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle"></i>
            <!-- th:text → muestra el mensaje de éxito -->
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Mensajes de error -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-circle"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Aquí se inserta el contenido de cada página -->
        <th:block th:replace="${contenido}"/>
    </main>

    <!-- ── FOOTER ──────────────────────────────────────── -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-0">
                <i class="bi bi-code-square"></i>
                CS Hub — Repositorio de Recursos para Computer Science
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
