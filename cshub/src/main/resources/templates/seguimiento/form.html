<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento — CS Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        footer { background-color: #212529; color: #adb5bd; padding: 20px 0; margin-top: 60px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-code-square"></i> CS Hub
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/recursos}">
                        <i class="bi bi-collection"></i> Recursos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/seguimientos}">
                        <i class="bi bi-bookmark-check"></i> Mi Lista
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-4">

    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card p-4">

                <h3 class="mb-4">
                    <i class="bi bi-bookmark-plus"></i>
                    <span th:text="${titulo}">Seguimiento</span>
                </h3>

                <form th:action="@{/seguimientos/guardar}"
                      th:object="${seguimiento}"
                      method="post">

                    <input type="hidden" th:field="*{id}">

                    <!-- NOMBRE DE USUARIO -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Tu nombre <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control"
                               th:field="*{nombreUsuario}"
                               placeholder="Ej: Tomas"
                               required>
                        <div class="form-text">
                            Usa siempre el mismo nombre para ver tu lista completa.
                        </div>
                    </div>

                    <!-- RECURSO -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Recurso <span class="text-danger">*</span>
                        </label>
                        <!--
                          Este select muestra todos los recursos disponibles.
                          El th:selected marca el que viene preseleccionado
                          desde la página de detalle del recurso.
                        -->
                        <select class="form-select" name="recursoId" required>
                            <option value="">Selecciona un recurso...</option>
                            <option th:each="r : ${recursos}"
                                    th:value="${r.id}"
                                    th:text="${r.titulo}"
                                    th:selected="${seguimiento.recurso != null
                                               && seguimiento.recurso.id == r.id}">
                                Recurso
                            </option>
                        </select>
                    </div>

                    <div class="row">
                        <!-- FECHA DE INICIO -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">
                                Fecha de inicio <span class="text-danger">*</span>
                            </label>
                            <input type="date" class="form-control"
                                   th:field="*{fechaInicio}"
                                   required>
                        </div>

                        <!-- FECHA META -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Fecha meta</label>
                            <input type="date" class="form-control"
                                   th:field="*{fechaMeta}">
                            <div class="form-text">¿Cuándo quieres terminar?</div>
                        </div>
                    </div>

                    <!-- ESTADO -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Estado</label>
                        <select class="form-select" th:field="*{estado}">
                            <option th:each="e : ${estados}"
                                    th:value="${e}"
                                    th:text="${e.nombre}">Estado</option>
                        </select>
                    </div>

                    <!-- NOTAS -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Notas personales</label>
                        <textarea class="form-control" th:field="*{notas}"
                                  rows="3"
                                  placeholder="Apuntes, tips, por dónde empezar..."></textarea>
                    </div>

                    <!-- BOTONES -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-bookmark-check"></i> Guardar Seguimiento
                        </button>
                        <a th:href="@{/seguimientos}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

</main>

<footer class="text-center">
    <div class="container">
        <p class="mb-0">
            <i class="bi bi-code-square"></i> CS Hub — Repositorio de Recursos para Computer Science
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
